    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return fetchHolder || originalFetch; },
            set: function(val) { fetchHolder = val; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // In case property is non-configurable, suppress uncaught error from external scripts
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
